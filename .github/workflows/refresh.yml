name: Refresh official pricing documents
on:
  schedule:
    - cron: '15 12 * * *'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  refresh:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install -r requirements.txt
      - name: Fetch official source pages and create pending review report
        run: python scheduled_refresh.py
      - name: Commit pending review report
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add refresh_status.json pending_price_review.json
          git diff --cached --quiet || (git commit -m "Refresh official pricing research" && git push)
